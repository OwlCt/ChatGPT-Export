name: Bug report
description: Report an exporter or offline reader bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Exporter userscript
        - Offline reader
        - Markdown output
        - Images or attachments
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and userscript manager
      placeholder: Chrome 126, Tampermonkey 5.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal redacted sample when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      render: text
